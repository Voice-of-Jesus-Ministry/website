name: Agent Governance Review

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to evaluate"
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  tally-governance:
    runs-on: ubuntu-latest
    if: github.event.pull_request != null || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate Governance Tally
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : parseInt(context.payload.inputs.pr_number, 10);

            const weights = {
              user: 4,
              Guardian: 1,
              Electra: 1,
              Ella: 1,
            };

            // Fetch reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Map latest state per user/agent
            const latestReviews = new Map();
            for (const r of reviews.data) {
              const username = r.user.login;
              if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') {
                latestReviews.set(username, r.state);
              }
            }

            let approveScore = 0;
            let rejectScore = 0;
            let approveCount = 0;
            let rejectCount = 0;

            for (const [author, state] of latestReviews.entries()) {
              // Determine voter key (owner vs AI agents)
              let voterKey = author;
              if (author === context.repo.owner || author === 'NicholaiMadias') {
                voterKey = 'user';
              }

              const weight = weights[voterKey] ?? 1;

              if (state === 'APPROVED') {
                approveScore += weight;
                approveCount += 1;
              } else if (state === 'CHANGES_REQUESTED') {
                rejectScore += weight;
                rejectCount += 1;
              }
            }

            console.log(`Tally for PR #${prNumber}: Approvals: ${approveCount} (Score: ${approveScore}), Rejections: ${rejectCount} (Score: ${rejectScore})`);

            // Decision logic:
            // 1. Uncontested: 0 rejects and >= 1 approval -> PASS
            // 2. Contested: approveScore > rejectScore and approveScore >= 2 -> PASS
            let passed = false;
            let reason = '';

            if (rejectCount === 0) {
              if (approveCount >= 1) {
                passed = true;
                reason = `PASSED (Uncontested): ${approveCount} approval(s) (score: ${approveScore}) with 0 rejections.`;
              } else {
                reason = 'Awaiting at least 1 approval.';
              }
            } else {
              if (approveScore > rejectScore && approveScore >= 2) {
                passed = true;
                reason = `PASSED (Contested): Approve score (${approveScore}) exceeded Reject score (${rejectScore}).`;
              } else {
                passed = false;
                reason = `REJECTED (Contested): Reject score (${rejectScore}) >= Approve score (${approveScore}).`;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### ⚖️ Multi-Agent Governance Tally\n\n- **Status:** ${passed ? '✅ PASSED' : '⏳ PENDING / REJECTED'}\n- **Summary:** ${reason}\n- **Scores:** Approve: ${approveScore} | Reject: ${rejectScore}`,
            });

            if (!passed && rejectCount > 0) {
              core.setFailed(`Governance vote failed: ${reason}`);
            }
