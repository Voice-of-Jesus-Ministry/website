name: Guardian Governance Vote

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  request-vote:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.vote.outputs.issue_number }}
    steps:
      - name: Create Vote Request
        id: vote
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Guardian Governance Vote

Voting closes in 120 seconds.

### Vote Commands
User:
- \`/guardian-approve\`
- \`/guardian-reject\`

### Vote Weights
- User = 4
- Guardian = 1
- Electra = 1
- Ella = 1

Approval Threshold = 2 (Requires Approve >= 2 and Approve > Reject)`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Guardian Vote",
              body: body
            });
            core.setOutput("issue_number", issue.data.number);

  guardian-review:
    needs: request-vote
    runs-on: ubuntu-latest
    outputs:
      guardian_vote: ${{ steps.guardian.outputs.vote }}
    steps:
      - id: guardian
        run: echo "vote=approve" >> $GITHUB_OUTPUT

  electra-review:
    needs: request-vote
    runs-on: ubuntu-latest
    outputs:
      electra_vote: ${{ steps.electra.outputs.vote }}
    steps:
      - id: electra
        run: echo "vote=approve" >> $GITHUB_OUTPUT

  ella-review:
    needs: request-vote
    runs-on: ubuntu-latest
    outputs:
      ella_vote: ${{ steps.ella.outputs.vote }}
    steps:
      - id: ella
        run: echo "vote=approve" >> $GITHUB_OUTPUT

  wait-for-votes:
    needs:
      - request-vote
      - guardian-review
      - electra-review
      - ella-review
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.count.outputs.approved }}
    steps:
      - name: Wait 2 Minutes
        run: sleep 120

      - id: count
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.request-vote.outputs.issue_number }}
          GUARDIAN: ${{ needs.guardian-review.outputs.guardian_vote }}
          ELECTRA: ${{ needs.electra-review.outputs.electra_vote }}
          ELLA: ${{ needs.ella-review.outputs.ella_vote }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            let approve = 0;
            let reject = 0;

            const scoreVote = (vote, weight) => {
              if (vote === "approve") approve += weight;
              if (vote === "reject") reject += weight;
            };

            scoreVote(process.env.GUARDIAN, 1);
            scoreVote(process.env.ELECTRA, 1);
            scoreVote(process.env.ELLA, 1);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber
              }
            );

            const userApprove = comments.find(c => c.body.includes("/guardian-approve"));
            const userReject = comments.find(c => c.body.includes("/guardian-reject"));

            if (userApprove) approve += 4;
            if (userReject) reject += 4;

            const approved = approve >= 2 && approve > reject;
            core.setOutput("approved", approved);

            const resultText = `## Guardian Vote Complete

- **Approve Score:** ${approve}
- **Reject Score:** ${reject}
- **Result:** ${approved ? "APPROVED" : "REJECTED"}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: resultText
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: "closed"
            });

  commit-push:
    needs: wait-for-votes
    if: needs.wait-for-votes.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.name "Guardian Bot"
          git config user.email "guardian-bot@users.noreply.github.com"
      - name: Commit Changes
        run: |
          git add .
          git diff --cached --quiet || git commit -m "guardian: approved remediation"
      - name: Push
        run: git push

  deploy:
    needs: commit-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploy logic triggered after approved push"

  summary:
    needs:
      - wait-for-votes
      - commit-push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "# Guardian Governance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Approved:** ${{ needs.wait-for-votes.outputs.approved }}" >> $GITHUB_STEP_SUMMARY
