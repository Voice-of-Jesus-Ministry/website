name: "↔️ Sync Secrets & Assets Across Repos"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

env:
  TARGET_REPOS: |
    Voice-of-Jesus-Ministry/arcade
    Voice-of-Jesus-Ministry/tools
    Voice-of-Jesus-Ministry/gemini

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Gather secrets from this repo
        id: secrets
        run: |
          echo "Fetching secret list..."
          SECRETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets")
          echo "secrets=$SECRETS" >> $GITHUB_OUTPUT

      - name: Replicate each secret to target repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Parsing secret list..."
          echo "${{ steps.secrets.outputs.secrets }}" | jq -r '.secrets[].name' | while read -r SECRET; do
            if [[ "$SECRET" == "GITHUB_TOKEN" ]]; then continue; fi
            echo "Processing $SECRET"
            ENC_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/$SECRET")
            ENC_VALUE=$(echo "$ENC_JSON" | jq -r '.encrypted_value')
            KEY_ID=$(echo "$ENC_JSON" | jq -r '.key_id')
            IFS=$'\n' read -d '' -r -a REPOS <<< "$TARGET_REPOS"
            for REPO in "${REPOS[@]}"; do
              # Get target repo public key (required by API)
              TARGET_KEY_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/secrets/public-key")
              TARGET_KEY_ID=$(echo "$TARGET_KEY_JSON" | jq -r '.key_id')
              # Push secret (reuse encrypted value from source; API will re‑encrypt)
              curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"encrypted_value\":\"$ENC_VALUE\",\"key_id\":\"$TARGET_KEY_ID\"}" \
                "https://api.github.com/repos/$REPO/actions/secrets/$SECRET"
              echo "  → $REPO"
            done
          done

      - name: Placeholder – sync arcade & tool pages
        run: |
          echo "🛠️  Sync logic for static pages can be added here."
