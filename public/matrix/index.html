<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix of Conscience | Access Terminal</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .terminal {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #00ff41;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 { text-transform: uppercase; letter-spacing: 2px; }
        .btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn:hover { background: #00ff41; color: #050505; }
        #status { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>Matrix of Conscience</h1>
        <p>Awaiting connection... Operative Nova, please authenticate to access the grid.</p>
        <button class="btn" id="loginBtn">Initialize Authorization</button>
        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Replace with your actual Firebase config object variables
        const firebaseConfig = {
            projectId: "amazing-grace-hl"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Establishing secure connection...";

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                statusDiv.innerHTML = `<span style="color: #fff;">Access Granted.</span><br>Welcome back, ${user.displayName}.`;
            } catch (error) {
                statusDiv.innerText = `Authentication Failed: ${error.message}`;
            }
        });
    </script>
</body>
</html>
